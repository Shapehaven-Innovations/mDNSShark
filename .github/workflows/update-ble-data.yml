name: Update Bluetooth data

# Regenerates the bundled Bluetooth lookup tables monthly and opens a pull request when anything changed.
# The app never downloads these at runtime. Needs Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and regenerate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_ble_data.py | tee report.txt

      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The SOURCE file carries a date, so it alone must not trigger a pull request.
          if git diff --quiet -- Packages/DeviceFingerprint ':!Packages/DeviceFingerprint/Sources/DeviceFingerprint/Resources/ble-data-SOURCE.txt'; then
            echo "No changes."
            exit 0
          fi
          branch="ble-data-$(date +%Y-%m-%d)"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout -b "$branch"
          git add Packages/DeviceFingerprint
          git commit -m "Refresh bundled Bluetooth data"
          git push origin "$branch"
          {
            echo "Regenerated by scripts/update_ble_data.py. Row counts and sources are in ble-data-SOURCE.txt."
            echo
            echo '```'
            cat report.txt
            echo '```'
          } > body.txt
          gh pr create --title "Refresh bundled Bluetooth data" --body-file body.txt --base main --head "$branch"
